services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartcity
      POSTGRES_PASSWORD: smartcity
      POSTGRES_DB: iluminacao_publica
    ports:
      - '5432:5432'
    volumes:
      - smartcity-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartcity -d iluminacao_publica']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: smartcity-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dentro da rede do compose o host do banco é `postgres`, não `localhost`
      # — por isso o DATABASE_URL do .env não serve aqui e é sobrescrito.
      DATABASE_URL: 'postgresql://smartcity:smartcity@postgres:5432/iluminacao_publica?schema=public'
      PORT: 3000
      # auto = seed + backfill só na primeira subida (banco vazio).
      DB_BOOTSTRAP: ${DB_BOOTSTRAP:-auto}
      # Tamanho do histórico gerado no bootstrap (dias de telemetria bruta e de
      # agregados diários). Reduza para uma primeira subida mais rápida.
      DIAS_RAW: ${DIAS_RAW:-30}
      DIAS_AGREGADO: ${DIAS_AGREGADO:-740}
      # camadas = dados vindos do fog (edge → fog → nuvem); interno = simulador
      # embutido na API (modo original, reserva caso as camadas falhem).
      SIMULADOR_MODO: ${SIMULADOR_MODO:-camadas}
      MQTT_NUVEM_URL: mqtt://mosquitto-nuvem:1883
      # E-mail das notificações das regras: Mailpit (caixa em http://localhost:8025).
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      ALARMES_EMAIL_DE: ${ALARMES_EMAIL_DE:-alarmes@itaguari.local}
      # OTA com grupo canário: ondas (% acumulado), janela de observação por onda
      # e critérios de reversão (falha de instalação e consumo canário/controle).
      OTA_ONDAS: ${OTA_ONDAS:-5,25,50,100}
      OTA_JANELA_S: ${OTA_JANELA_S:-120}
      OTA_LIMIAR_FALHA_PCT: ${OTA_LIMIAR_FALHA_PCT:-5}
      OTA_LIMIAR_RAZAO_CONSUMO: ${OTA_LIMIAR_RAZAO_CONSUMO:-1.5}
      SIMULADOR_ENABLED: ${SIMULADOR_ENABLED:-true}
      SIMULADOR_INTERVALO_SENSORES_MS: ${SIMULADOR_INTERVALO_SENSORES_MS:-5000}
      SIMULADOR_INTERVALO_TELEMETRIA_MS: ${SIMULADOR_INTERVALO_TELEMETRIA_MS:-10000}
      SIMULADOR_INTERVALO_STATUS_MS: ${SIMULADOR_INTERVALO_STATUS_MS:-30000}
      SIMULADOR_INTERVALO_LIMPEZA_MS: ${SIMULADOR_INTERVALO_LIMPEZA_MS:-21600000}
      SIMULADOR_RETENCAO_DIAS: ${SIMULADOR_RETENCAO_DIAS:-40}
    ports:
      - '${PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          'process.exit((await fetch("http://127.0.0.1:3000/")).ok ? 0 : 1)',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s

  # Servidor de e-mail de teste: recebe as notificações das regras e mostra
  # a caixa de entrada em http://localhost:8025 (nada sai para a internet).
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: smartcity-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'

  # Broker MQTT do campo (rede local): postes (edge) ↔ gateways (fog).
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartcity-mosquitto
    restart: unless-stopped
    ports:
      - '1883:1883'
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test:
        [
          'CMD',
          'mosquitto_sub',
          '-h',
          'localhost',
          '-t',
          '$$SYS/broker/uptime',
          '-C',
          '1',
          '-W',
          '3',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Camada edge: os 248 postes simulados como dispositivos MQTT. Usa a mesma
  # imagem da API com outro comando (e sem o entrypoint que prepara o banco).
  edge:
    build: .
    container_name: smartcity-edge
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      app:
        condition: service_healthy
    entrypoint: []
    command: ['bun', 'run', 'dist/edge/main.js']
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      # Provisionamento: o campo pergunta à nuvem quais postes existem.
      EDGE_API_URL: http://app:3000
      EDGE_VERSAO_FIRMWARE: ${EDGE_VERSAO_FIRMWARE:-2.4.1}
      EDGE_INTERVALO_SENSORES_MS: ${EDGE_INTERVALO_SENSORES_MS:-5000}
      EDGE_INTERVALO_TELEMETRIA_MS: ${EDGE_INTERVALO_TELEMETRIA_MS:-10000}
      EDGE_INTERVALO_SAUDE_MS: ${EDGE_INTERVALO_SAUDE_MS:-30000}
      EDGE_INTERVALO_FALHAS_MS: ${EDGE_INTERVALO_FALHAS_MS:-30000}
      EDGE_DURACAO_OTA_MS: ${EDGE_DURACAO_OTA_MS:-8000}

  # Broker MQTT da nuvem (uplink): gateways (fog) ↔ API. Separado do broker do
  # campo para que a queda da nuvem não afete a rede local (e para demonstrar o
  # buffer do fog: `docker compose stop mosquitto-nuvem`).
  mosquitto-nuvem:
    image: eclipse-mosquitto:2
    container_name: smartcity-mosquitto-nuvem
    restart: unless-stopped
    ports:
      - '1884:1883'
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test:
        [
          'CMD',
          'mosquitto_sub',
          '-h',
          'localhost',
          '-t',
          '$$SYS/broker/uptime',
          '-C',
          '1',
          '-W',
          '3',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Camada fog: um gateway por bairro entre o campo e a nuvem — diagnostica
  # status, agrega a telemetria e sobe só resumos, eventos e alertas.
  fog:
    build: .
    container_name: smartcity-fog
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      app:
        condition: service_healthy
    # Sem condição de saúde de propósito: o fog sobe mesmo com a nuvem fora e
    # guarda as mensagens até o uplink voltar.
    entrypoint: []
    command: ['bun', 'run', 'dist/fog/main.js']
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_NUVEM_URL: mqtt://mosquitto-nuvem:1883
      FOG_API_URL: http://app:3000
      FOG_LIMIAR_CONSUMO_ALTO: ${FOG_LIMIAR_CONSUMO_ALTO:-1.5}
      FOG_LIMIAR_RETORNO_NORMAL: ${FOG_LIMIAR_RETORNO_NORMAL:-1.3}
      FOG_TIMEOUT_OFFLINE_MS: ${FOG_TIMEOUT_OFFLINE_MS:-30000}
      FOG_JANELA_RESUMO_MS: ${FOG_JANELA_RESUMO_MS:-60000}

volumes:
  smartcity-pgdata:
