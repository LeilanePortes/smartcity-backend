# Broker MQTT da rede simulada (serviço `mosquitto` do docker-compose.yml).
# Liga as camadas edge (postes), fog (gateways) e nuvem (API).
#
# O Mosquitto 2 só aceita conexões locais até receber um listener explícito.
# allow_anonymous true é só para o ambiente acadêmico/local: em produção, use
# usuários (mosquitto_passwd), allow_anonymous false e TLS na porta 8883.
listener 1883
allow_anonymous true

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
